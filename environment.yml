name: LabelForge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # --- Cloud LLM providers ---
    - google-genai==2.9.0
    - google-cloud-aiplatform==1.158.0
    - anthropic==0.111.0
    - openai==2.43.0

    # --- Web framework ---
    - flask==3.1.3
    - authlib==1.7.2

    # --- Dataset reading ---
    - openpyxl==3.1.5

    # --- Hardware detection ---
    - psutil==7.2.2

    # --- Model downloads ---
    - huggingface_hub==1.20.1

    # --- Cryptographic export/import (.lfarb) ---
    - cryptography==49.0.0

    # --- HTTP downloads ---
    - requests==2.34.2

    # --- Utils ---
    - python-dotenv==1.2.2

    # --- Local LLM GGUF (instalado por setup_env.py, NO aqui) ---
    # setup_env.py detecta GPU y descarga la wheel precompilada correcta (CUDA/Vulkan/Metal)
    # o compila desde fuente como ultimo recurso. No incluir en requirements base.
    # - llama-cpp-python>=0.3.0   # <-- manejado por setup_env.py

