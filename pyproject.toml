[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "label-forge"
version = "0.3.0"
description = "Etiquetado auditable de datasets con paneles de arbitros LLM locales y remotos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.1",
    "cryptography>=41.0.0",
    "flask>=3.1.0",
    "google-cloud-aiplatform>=1.157.0",
    "google-genai>=2.8.0",
    "huggingface-hub>=1.0.0",
    "openai>=2.41.1",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=12.0.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "ruff>=0.9",
]

[tool.setuptools]
include-package-data = true
py-modules = ["main_cli", "main_tui", "main_webapp", "manage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["labelforge_core*", "webapp*"]
namespaces = true

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/*"]

[tool.coverage.run]
branch = true
source = ["labelforge_core", "webapp"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    '\.\.\.',
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive", "checkpoints", "models", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"webapp/app.py" = ["E402", "F401"]
"labelforge_core/label_persuasion.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(?x)(archive|checkpoints|models|output)/"

[[tool.mypy.overrides]]
module = [
    "google.*",
    "llama_cpp.*",
    "vertexai.*",
]
ignore_missing_imports = true
